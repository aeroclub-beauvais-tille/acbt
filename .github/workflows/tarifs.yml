name: Tarifs modifiés dans l'appli

# Tous les quarts d'heure : si l'admin a ajouté, modifié ou annulé un changement de tarif
# (appli > Admin > Tarifs), on republie le site pour que la page Tarifs et la page Baptême suivent.
# Sinon, rien ne se passe (quelques secondes de vérification).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire la version des tarifs programmés
        id: v
        run: |
          v=$(curl -fsS --retry 3 -A acbt-publication https://acbt60.fr/api/tarifs | jq -r .version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version actuelle : $v"
      - name: Dernière version publiée
        id: cache
        uses: actions/cache@v4
        with:
          path: .tarifs-version
          key: tarifs-${{ steps.v.outputs.version }}
      - name: Republier le site si les tarifs ont changé
        if: steps.cache.outputs.cache-hit != 'true' && steps.v.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ steps.v.outputs.version }}" > .tarifs-version
          gh workflow run cloudflare.yml --repo "${{ github.repository }}" --ref main
