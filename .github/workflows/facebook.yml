name: Copier les publications Facebook en actus

# À 9h, 13h, 16h, 19h et 23h (heure de Paris), les nouvelles publications avec photos de la page Facebook du club
# deviennent des actualités du site (scripts/importer-facebook.mjs), puis le site est republié.
#
# Secrets nécessaires (Settings > Secrets and variables > Actions) :
#  - FACEBOOK_PAGE_ID : identifiant de la page ACBT60 ;
#  - FACEBOOK_PAGE_TOKEN : clé d'accès à la page (sans date d'expiration).
# Sans ces secrets, rien ne se passe. Si la clé cesse de fonctionner, cette tâche
# échoue et GitHub envoie un mail d'alerte.
#
# GitHub planifie en heure UTC, sans heure d'été : on prévoit les deux séries d'horaires
# et la tâche s'arrête tout de suite (quelques secondes) quand ce n'est pas la bonne saison.
# Le lancement à la main (bouton « Run workflow ») marche toujours, à toute heure.
on:
  schedule:
    # Heure d'hiver (Paris = UTC+1) : 9h, 13h, 16h, 19h, 23h
    - cron: '7 8,12,15,18,22 * * *'
    # Heure d'été (Paris = UTC+2) : 9h, 13h, 16h, 19h, 23h
    - cron: '7 7,11,14,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: facebook
  cancel-in-progress: false

jobs:
  copier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier l'heure de Paris
        id: heure
        run: |
          decalage=$(TZ=Europe/Paris date +%z)
          planif='${{ github.event.schedule }}'
          ok=true
          if [ -n "$planif" ]; then
            case "$planif" in
              '7 8,12,15,18,22 * * *') [ "$decalage" = "+0100" ] || ok=false ;;
              '7 7,11,14,17,21 * * *') [ "$decalage" = "+0200" ] || ok=false ;;
            esac
          fi
          echo "Paris : $(TZ=Europe/Paris date '+%H:%M %z'), lancement : $ok"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.heure.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.heure.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Lire la page Facebook
        id: import
        if: steps.heure.outputs.ok == 'true'
        run: node scripts/importer-facebook.mjs
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      - name: Enregistrer les nouvelles actus
        if: steps.import.outputs.ajoutees != '' && steps.import.outputs.ajoutees != '0'
        run: |
          git config user.name "Facebook ACBT60"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/actualites public/uploads/actualites src/data/facebook-copiees.json
          git commit -m "Actus : ${{ steps.import.outputs.ajoutees }} publication(s) Facebook copiée(s)"
          git pull --rebase origin main
          git push origin HEAD:main
      # Un envoi fait par cette tâche ne relance pas la publication tout seul : on la demande.
      - name: Republier le site
        if: steps.import.outputs.ajoutees != '' && steps.import.outputs.ajoutees != '0'
        run: gh workflow run cloudflare.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
